<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="420" viewBox="0 0 1280 420" role="img" aria-labelledby="title desc">
  <title id="title">SP Skill Dynamic Selector</title>
  <desc id="desc">A task enters a local skill library; the user chooses the skills before execution. Codex first, portable by design.</desc>
  <defs>
    <linearGradient id="bg" x2="1" y2="1"><stop stop-color="#102126"/><stop offset="1" stop-color="#111827"/></linearGradient>
    <linearGradient id="line"><stop stop-color="#69dfbc"/><stop offset="1" stop-color="#6d93ed"/></linearGradient>
    <pattern id="dots" width="24" height="24" patternUnits="userSpaceOnUse"><circle cx="1" cy="1" r="1" fill="#87b2aa" opacity=".13"/></pattern>
  </defs>
  <rect width="1280" height="420" rx="24" fill="url(#bg)"/>
  <rect width="1280" height="420" rx="24" fill="url(#dots)"/>
  <path d="M0 386H1280" stroke="#294148"/>
  <g font-family="Segoe UI,Arial,sans-serif">
    <rect x="48" y="40" width="151" height="29" rx="14" fill="#213f3d"/>
    <circle cx="65" cy="54" r="4" fill="#7ae5bd"/>
    <text x="78" y="59" font-size="12" font-weight="600" letter-spacing="1" fill="#a8f1d6">CODEX FIRST</text>
    <text x="48" y="130" font-size="49" font-weight="700" letter-spacing="-1.5" fill="#f5faf9">The right skills.</text>
    <text x="48" y="188" font-size="49" font-weight="700" letter-spacing="-1.5" fill="#85e6c3">Before the first action.</text>
    <text x="50" y="237" font-size="19" fill="#b0c5c6">Describe the task. Explore the skills. You choose.</text>
    <g font-size="13" fill="#d9e4e6">
      <rect x="48" y="279" width="119" height="33" rx="7" fill="#20343b" stroke="#3b535a"/><text x="65" y="300">LOCAL FIRST</text>
      <rect x="179" y="279" width="153" height="33" rx="7" fill="#20343b" stroke="#3b535a"/><text x="195" y="300">NO FIXED TOP-K</text>
      <rect x="344" y="279" width="157" height="33" rx="7" fill="#20343b" stroke="#3b535a"/><text x="360" y="300">YOU CONTROL IT</text>
    </g>
    <g transform="translate(696 60)">
      <path d="M53 134H103M103 56V248M103 56H141M103 152H141M103 248H141M404 56H444V248M404 152H444M404 248H444M444 152H475" fill="none" stroke="url(#line)" stroke-width="2" opacity=".75"/>
      <rect x="0" y="105" width="79" height="59" rx="12" fill="#24443f" stroke="#5fba9e"/>
      <text x="18" y="140" fill="#d1f8e9" font-size="14" font-weight="600">TASK</text>
      <g fill="#1a2c35" stroke="#3c535d"><rect x="141" y="20" width="263" height="73" rx="12"/><rect x="141" y="116" width="263" height="73" rx="12"/><rect x="141" y="212" width="263" height="73" rx="12"/></g>
      <g fill="#243b44"><rect x="158" y="38" width="36" height="36" rx="8"/><rect x="158" y="134" width="36" height="36" rx="8"/><rect x="158" y="230" width="36" height="36" rx="8"/></g>
      <g fill="none" stroke="#a3d8d0" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><rect x="168" y="46" width="16" height="21" rx="2"/><path d="M172 52h8m-8 5h8m-8 5h5"/><path d="m166 158 3-9 11-11 6 6-11 11-9 3m3-9 6 6m3-15 6 6"/><circle cx="174" cy="246" r="8"/><path d="m180 252 7 7m-17-13 3 3 5-6"/></g>
      <g font-size="15" font-weight="600" fill="#e4eded"><text x="209" y="52">Understand</text><text x="209" y="148">Create</text><text x="209" y="244">Verify</text></g>
      <g font-size="12" fill="#91a9b3"><text x="209" y="73">Sources, papers, context</text><text x="209" y="169">Writing, slides, diagrams</text><text x="209" y="265">Evidence, layout, quality</text></g>
      <g stroke="#81e7be" fill="none" stroke-width="2"><rect x="369" y="45" width="17" height="17" rx="4"/><path d="m373 53 3 3 6-7"/><rect x="369" y="141" width="17" height="17" rx="4"/><path d="m373 149 3 3 6-7"/></g>
      <rect x="369" y="237" width="17" height="17" rx="4" fill="none" stroke="#718998" stroke-width="1.5"/>
      <circle cx="475" cy="152" r="7" fill="#81e7be"/>
      <text x="211" y="316" font-size="12" letter-spacing="2" fill="#91b5bb">CHOOSE → THEN EXECUTE</text>
    </g>
    <text x="48" y="407" font-size="11" letter-spacing="2.2" fill="#91aeb3">SP / SKILL DYNAMIC SELECTOR</text>
    <text x="1035" y="407" font-size="11" letter-spacing="1.5" fill="#91aeb3">AGENT SKILL · v0.1.2</text>
  </g>
